<section id="admission" class="sec alt">
  <h2 data-t="Окууга тапшырыңыз|Подайте заявку|Apply for Admission|قدّم للقبول"></h2>
  <div class="adm">
    <div>
      <div class="card rv"><h3 data-t="Кабыл алуу жараяны|Процесс поступления|Application process|مراحل القبول"></h3>
        <ol class="steps">
          <li data-t="Форманы толтуруңуз|Заполните форму|Fill in the form|املأ النموذج"></li>
          <li data-t="Документтерди тапшырыңыз|Предоставьте документы|Submit your documents|قدّم الوثائق"></li>
          <li data-t="Маектешүүдөн өтүңүз|Пройдите собеседование|Take the interview|اجتز المقابلة"></li>
          <li data-t="Кабыл алуу жөнүндө жооп алыңыз|Получите ответ о зачислении|Receive the decision|استلم قرار القبول"></li>
        </ol></div>
      <div class="card rv"><h3 data-t="Керектүү документтер|Необходимые документы|Required documents|الوثائق المطلوبة"></h3>
        <ul class="check">
          <li data-t="Паспорт / ID көчүрмөсү|Копия паспорта / ID|Copy of passport / ID|نسخة من الجواز / الهوية"></li>
          <li data-t="Билими тууралуу документ|Документ об образовании|Education document|وثيقة التعليم"></li>
          <li data-t="Туулгандыгы тууралуу күбөлүк|Свидетельство о рождении|Birth certificate|شهادة الميلاد"></li>
          <li data-t="Сүрөттөр|Фотографии|Photos|صور"></li>
          <li data-t="Башка талап кылынган документтер|Другие необходимые документы|Other required documents|وثائق أخرى مطلوبة"></li>
        </ul>
        <p class="note" data-t="Эскертүү: талап кылынган документтер кабыл алуу шарттарына жараша өзгөрүшү мүмкүн.|Примечание: список документов может меняться в зависимости от условий приёма.|Note: required documents may change depending on the admission terms.|ملاحظة: قد تتغير الوثائق المطلوبة حسب شروط القبول."></p>
      </div>
    </div>
    <form id="form" class="card rv" novalidate>
      <label><span data-t="Аты-жөнү|ФИО|Full name|الاسم الكامل"></span><input name="name" required autocomplete="name"></label>
      <label><span data-t="Туулган күнү|Дата рождения|Date of birth|تاريخ الميلاد"></span><input name="birth" type="date" required></label>
      <label><span data-t="Телефон номери|Номер телефона|Phone number|رقم الهاتف"></span><input name="phone" type="tel" required autocomplete="tel"></label>
      <label><span>Email</span><input name="email" type="email" required autocomplete="email"></label>
      <label><span data-t="Жашаган жери|Место проживания|Address|مكان الإقامة"></span><input name="address" required></label>
      <label><span data-t="Билими|Образование|Education level|المؤهل"></span><input name="edu"></label>
      <label><span data-t="Багытты тандоо|Выбор направления|Choose program|اختر المجال"></span>
        <select name="prog" required><option value="" data-t="— тандаңыз —|— выберите —|— select —|— اختر —"></option><option data-t="Куран|Коран|Quran|القرآن"></option><option data-t="Ислам илимдери|Исламские науки|Islamic Sciences|العلوم الإسلامية"></option><option data-t="Араб тили|Арабский язык|Arabic Language|اللغة العربية"></option></select></label>
      <label><span data-t="Кошумча маалымат|Дополнительная информация|Additional information|معلومات إضافية"></span><textarea name="msg" rows="3"></textarea></label>
      <label><span data-t="Документ жүктөө (макс. 5 МБ)|Загрузить документ (макс. 5 МБ)|Upload document (max 5 MB)|رفع وثيقة (حتى 5 ميغابايت)"></span><input name="file" type="file" accept=".pdf,.jpg,.jpeg,.png"></label>
      <button class="btn gold" type="submit" data-t="Катталуу|Записаться|Register|سجّل"></button>
      <a id="waBtn" class="btn wa" target="_blank" rel="noopener"><span data-t="WhatsApp аркылуу катталуу|Записаться через WhatsApp|Register via WhatsApp|التسجيل عبر واتساب"></span></a>
    </form>
  </div>
</section>
